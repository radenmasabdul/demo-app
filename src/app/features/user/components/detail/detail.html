<main class="space-y-6">
  <app-page-header title="User Detail" description="View user information" />

  <div class="py-4">
    <app-navigation
      to="/"
      label="Go Back"
      [isEditing]="isEditing()"
      [isSaving]="isSaving()"
      (editClick)="edit()"
      (cancelClick)="cancelEdit()"
      (saveClick)="save()"
    />
  </div>
  
  <app-api-state
    [isLoading]="isLoading()"
    [isError]="isError()"
    [isEmpty]="!user()"
  >
    @if (user(); as user) {
      <div class="relative">
        @if (isSaving()) {
          <div class="absolute inset-0 z-10 flex items-center justify-center rounded-xl bg-background/70 backdrop-blur-sm">
            <div class="flex items-center gap-2 text-sm font-medium text-muted-foreground">
              <span class="size-4 animate-spin rounded-full border-2 border-muted-foreground/30 border-t-primary"></span>
              Saving...
            </div>
          </div>
        }
        <app-information [user]="user" [isEditing]="isEditing()" [editForm]="editForm" />
      </div>
    }
  </app-api-state>
</main>
