<main class="space-y-6">
  <app-page-header title="User Management" description="Manage users and their access." />

  <div class="flex flex-col gap-4 md:flex-row md:items-center mb-0 py-6">
    <div class="w-full md:flex-1">
      <app-search (searchChange)="onSearchChange($event)" />
    </div>
  
    <div class="w-full md:w-40">
      <app-select placeholder="Role" label="Role" [items]="roles" (valueChange)="onRoleChange($event)" />
    </div>
  
    <div class="w-full md:w-40">
      <app-select placeholder="Status" label="Status" [items]="statuses" (valueChange)="onStatusChange($event)" />
    </div>
  
    <app-create-dialog />
  </div>

  <div>
    <app-api-state
      [isLoading]="isLoading()"
      [isError]="isError()"
      [isEmpty]="users().length === 0"
    >
      <app-table
        [columns]="userColumns"
        [data]="users()"
        [page]="page()"
        [pageSize]="pageSize()"
        [totalItems]="totalItems()"
        (actionClick)="onTableAction($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
      />
    </app-api-state>
  </div>
</main>
