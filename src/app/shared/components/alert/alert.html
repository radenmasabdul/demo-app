@if (alert(); as alert) {
<div class="pointer-events-none fixed right-4 top-4 z-50 w-[calc(100%-2rem)] max-w-sm">
  <div class="pointer-events-auto flex items-start gap-3 rounded-lg border p-4 shadow-lg"
    [class]="getClass(alert.variant)">
    <ng-icon [name]="getIcon(alert.variant)" class="mt-0.5 shrink-0 text-lg" />

    <div class="min-w-0 flex-1">
      <p class="font-medium">
        {{ alert.title }}
      </p>

      <p class="mt-1 text-sm opacity-90">
        {{ alert.description }}
      </p>
    </div>

    <button type="button" class="shrink-0 text-lg leading-none opacity-60 transition-opacity hover:opacity-100"
      (click)="close()">
      ×
    </button>
  </div>
</div>
}
